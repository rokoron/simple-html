<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デプロイ練習ページ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="badge">v1</p>
    <h1>デプロイ練習ページ</h1>
    <p class="lead">
      このページは、VSCode で作って Git で管理し、Vercel に公開するまでの
      流れを練習するための静的ページです。
    </p>

    <ul class="steps">
      <li>HTML と CSS だけで作る</li>
      <li>Git でバージョン管理する</li>
      <li>GitHub に push する</li>
      <li>Vercel で公開する</li>
    </ul>

    <p class="note">
      文字を書き換えて commit → push すると、Vercel が自動で再デプロイします。
      上の <strong>v1</strong> を v2、v3 と増やしていくと、
      反映されたかどうかがすぐ分かります。
    </p>

    <footer class="footer">SE trial</footer>
  </main>
</body>
</html>
